name: Fetch news candidates

# Setiap hari: ambil kandidat berita, kirim ke Telegram dengan tombol
# Setujui/Tolak, lalu simpan penanda "sudah dikirim" ke repo.
# Kandidat TIDAK tayang sebelum disetujui (lihat news-approval.yml).
#
# Secrets yang diperlukan (Settings -> Secrets and variables -> Actions):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
# Tanpa keduanya, langkah Telegram dilewati dan kandidat hanya disimpan di
# data/news-candidates.json.

on:
  schedule:
    - cron: "17 2 * * *" # 09:17 WIB
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-bot
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: node --test scripts/*.test.mjs
      - name: Fetch candidates
        run: node scripts/fetch-news.mjs
      - name: Send candidates to Telegram
        run: node scripts/telegram-news.mjs send
      - name: Commit candidate state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/news-candidates.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Update kandidat berita"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
