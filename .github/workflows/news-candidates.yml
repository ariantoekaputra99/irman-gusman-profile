name: Fetch news candidates

# Mengambil kandidat berita terbaru dan membuka PR berisi data/news-candidates.json.
# Kandidat TIDAK tayang di situs; tinjau dengan `npm run news:list`, lalu setujui
# atau tolak (lihat CMS.md). Perlu pengaturan: Settings -> Actions -> General ->
# "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: "17 2 * * 1" # Senin 09:17 WIB
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run filter tests
        run: node --test scripts/*.test.mjs
      - name: Fetch candidates
        run: node scripts/fetch-news.mjs
      - name: Open pull request if there are new candidates
        uses: peter-evans/create-pull-request@v7
        with:
          branch: news/candidates
          add-paths: data/news-candidates.json
          commit-message: "Update kandidat berita"
          title: "Kandidat berita baru (menunggu tinjauan)"
          body: |
            Kandidat berita hasil penyaringan otomatis. **Belum tayang** di situs.

            Penyaring kata kunci tidak bisa menilai nada berita. Sebelum menyetujui:
            - baca artikel aslinya, jangan hanya judulnya;
            - utamakan sumber yang kredibel/resmi;
            - tulis ringkasan sendiri (`--excerpt`), jangan menyalin teks artikel.

            Setujui: `npm run news:approve -- <slug> --category Daerah --excerpt "..."`
            Tolak:   `npm run news:reject -- <slug>`
          delete-branch: true
